services:

  django:
    build:
      context: ./app
    container_name: django_app
    user: "${UID}:${GID}"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - postgres
      - redis
      - mongo
    command: >
      sh -c " python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 "

  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    container_name: mongo_logs
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - django
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
  mongo_data:
  redis_data:
