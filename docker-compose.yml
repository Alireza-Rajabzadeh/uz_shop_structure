services:

  django:
    build:
      context: ./back
    container_name: django_app
    user: "${UID}:${GID}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /tmp
      DIGIKALA_RUNTIME_ROOT: /var/lib/uzshop/digikala
    volumes:
      - ./back:/app
      - ./runtime/digikala:/var/lib/uzshop/digikala
    networks:
      - app
      - storage
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    command: >
      sh -c " python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 "

  celery_worker:
    build:
      context: ./back
    container_name: celery_worker
    user: "${UID}:${GID}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /tmp
    volumes:
      - ./back:/app
    networks:
      - app
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=2

  celery_digikala_worker:
    build:
      context: ./back
    container_name: celery_digikala_worker
    user: "${UID}:${GID}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /tmp
      DIGIKALA_RUNTIME_ROOT: /var/lib/uzshop/digikala
    volumes:
      - ./back:/app
      - ./runtime/digikala:/var/lib/uzshop/digikala
    networks:
      - app
      - storage
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    command: >
      celery -A config worker --loglevel=info --queues=digikala
      --concurrency=1 --prefetch-multiplier=1

  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

  mongo:
    image: mongo:8
    container_name: mongo_logs
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: redis_cache
    restart: unless-stopped
    environment:
      BACKEND_REDIS_PASSWORD: ${BACKEND_REDIS_PASSWORD:?Set BACKEND_REDIS_PASSWORD in .env}
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$BACKEND_REDIS_PASSWORD redis-cli --user backend ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    secrets:
      - source: redis_users_acl
        target: redis_users_acl
    networks:
      - app

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - django
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app

volumes:
  postgres_data:
  mongo_data:
  redis_data:

secrets:
  redis_users_acl:
    file: ./redis/users.acl

networks:
  app:
    name: ${APP_NETWORK_NAME:-uzshop-app}
  storage:
    name: ${MINIO_NETWORK_NAME:-uzshop-storage}
    external: true
